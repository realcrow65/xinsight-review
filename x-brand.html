XBrandFullc\"><rect x=\"0\" y=\"0\" width=\"100\" height=\"100\"><\/rect><\/clipPath><mask id=\"gbXBrandFullm\" maskUnits=\"userSpaceOnUse\" x=\"-50\" y=\"-50\" width=\"200\" height=\"200\"><rect x=\"-50\" y=\"-50\" width=\"200\" height=\"200\" fill=\"#fff\"><\/rect><path d=\"M 1.0 112 L 99.0 -12\" stroke=\"#000\" stroke-width=\"38\" fill=\"none\"><\/path><\/mask><\/defs><g clip-path=\"url(#gbXBrandFullc)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"18\"><path d=\"M -13.1 5.4 L 1.5 9.0 C 55.4 20.4, 44.6 79.6, 98.5 91.0 L 113.1 94.6\" mask=\"url(#gbXBrandFullm)\"><\/path><path d=\"M 1.0 112 L 99.0 -12\"><\/path><\/g><\/svg>BRAND<\/span><\/div><\/div><\/div><section class=\"v3-sec\"  style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Why XBrand<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Senior Thinking. Real Craft.<br><span style=\"color: #AEB6BC\">Less Overhead.<\/span><\/h2><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 24px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #E3B23C\"><h3 class=\"t-h4\" style=\"margin: 0\">Senior People on the Work<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">The partners you meet lead the thinking and the craft. Your brand is never handed down to a junior team.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Agency-Network Leadership, Lean Team<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Leadership from international agency networks, delivered by a lean senior team without network overheads.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Brand and Growth Together<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">We connect positioning and identity to the one metric that matters, then test and scale what works.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Faster from Insight to Identity<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">AI-assisted research and visual exploration let us test directions early. Then we refine every detail by hand.<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #0B0F13; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Who We Help<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Wherever Your Brand Is Going Next.<\/h2><div class=\"v3-3col\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 24px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #E3B23C\"><h3 class=\"t-h4\" style=\"margin: 0\">Asian Businesses Going Global<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">You built a strong brand at home. We help you find a position and identity that work in new markets.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Global Brands Growing in Asia<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">You already have a brand. We help you adapt it for Asian markets and roll it out at a sensible cost.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Founders and New Ventures<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">You need a brand from day one. We help you get the foundations right before you scale.<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">What We Do<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">From What You Stand for<br><span style=\"color: #AEB6BC\">to How the World Sees It.<\/span><\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">Five kinds of work, used alone or together. We start with the one your business needs most.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Brand Strategy<\/h3><p class=\"t-b\" style=\"margin: 0; color: #F0C966\">Find where your business, your audience and your category meet.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Leadership workshop \u00b7 Golden Circle and brand journey map \u00b7 Positioning \u00b7 Brand architecture \u00b7 Value proposition<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Naming &amp; Messaging<\/h3><p class=\"t-b\" style=\"margin: 0; color: #F0C966\">Say it once, say it clearly, in every market.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Naming \u00b7 Tagline \u00b7 Messaging framework \u00b7 Tone of voice \u00b7 Bilingual copy<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Identity &amp; Art Direction<\/h3><p class=\"t-b\" style=\"margin: 0; color: #F0C966\">Make the strategy visible.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Brand level board \u00b7 Three to five art directions \u00b7 Logo and identity system \u00b7 Brand Book and guidelines<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Growth Marketing<\/h3><p class=\"t-b\" style=\"margin: 0; color: #F0C966\">Turn the brand into results.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">The one metric that matters \u00b7 Customer journey and funnel \u00b7 Rapid experiments \u00b7 Content and social<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Market Rollout &amp; Localisation<\/h3><p class=\"t-b\" style=\"margin: 0; color: #F0C966\">Carry the brand into new markets without losing it.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Local adaptation for Asian markets \u00b7 Launch campaign \u00b7 Website \u00b7 Brochures and sales materials \u00b7 Brand film<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\" id=\"sprint\" style=\"background: #0B0F13; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Featured Offer<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Global Brand &amp; IPO Readiness Sprint<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">For Mainland Chinese companies preparing to expand overseas and strengthen their corporate brand ahead of a possible Hong Kong listing.<\/p><p class=\"t-h4\" style=\"margin: 0; color: #F0C966\">Four weeks. Three working sessions in Hong Kong. One decision-ready brand strategy, and a clear plan for what to fix and build next.<\/p><div class=\"v3-4col\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 3px solid #E3B23C\"><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 0 0\"><span class=\"t-cap\" style=\"color: #E3B23C\">Week 1<\/span><h3 class=\"t-h4\" style=\"margin: 0\">Evidence Review<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Your materials, public presence and selected competitors, read for gaps and proof.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 0 0\"><span class=\"t-cap\" style=\"color: #E3B23C\">Week 2<\/span><h3 class=\"t-h4\" style=\"margin: 0\">Leadership Alignment<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Interviews and a first session to agree ambition, audiences and the questions to solve.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 0 0\"><span class=\"t-cap\" style=\"color: #E3B23C\">Week 3<\/span><h3 class=\"t-h4\" style=\"margin: 0\">Strategy Workshop<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Two positioning routes tested with management. One is chosen and built out.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 0 0\"><span class=\"t-cap\" style=\"color: #E3B23C\">Week 4<\/span><h3 class=\"t-h4\" style=\"margin: 0\">Playback and Roadmap<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Final strategy, narrative and a sequenced plan for the next 90 days and 12 months.<\/p><\/div><\/div><h3 class=\"t-h3\" style=\"margin: 0\">What You Leave with<\/h3><div class=\"v3-3col\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\"><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33\"><h4 class=\"t-b\" style=\"margin: 0; font-weight: 500; color: #F4F3EE\">Brand Readiness Diagnostic<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Where the current brand is clear, credible and consistent, and where it isn't.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33\"><h4 class=\"t-b\" style=\"margin: 0; font-weight: 500; color: #F4F3EE\">Core Brand Strategy Blueprint<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Purpose, positioning, value proposition, personality and architecture.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33\"><h4 class=\"t-b\" style=\"margin: 0; font-weight: 500; color: #F4F3EE\">Overseas and Capital-Market Narrative<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Company profile, corporate story and a message hierarchy with its proof.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33\"><h4 class=\"t-b\" style=\"margin: 0; font-weight: 500; color: #F4F3EE\">Brand Expression Brief<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Tone of voice and visual direction for the designers and writers who follow.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33\"><h4 class=\"t-b\" style=\"margin: 0; font-weight: 500; color: #F4F3EE\">90-Day and 12-Month Roadmap<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">What to fix first, what to build next, and who owns it.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33\"><h4 class=\"t-b\" style=\"margin: 0; font-weight: 500; color: #F4F3EE\">AI Opportunity Snapshot<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">The three AI opportunities most worth exploring next.<\/p><\/div><\/div><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">A brand strategy engagement. It does not include visual identity production, IPO, legal or regulatory advice.<\/p><div><a class=\"v3-btn\" href=\"#contact\" style=\"background: #E3B23C; border-color: #E3B23C; color: #0B0F13\">Ask About the Sprint <span aria-hidden=\"true\">\u2192<\/span><\/a><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Ways of Working<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Shaped Around What Your Brand Needs.<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">We don't sell one fixed package. We choose the way of working that fits your business, your team and your stage.<\/p><div class=\"v3-3col\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 24px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #E3B23C\"><h3 class=\"t-h4\" style=\"margin: 0\">Brand Project<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Strategy, identity and rollout, delivered and put into practice, not left as a deck.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Best for a new brand, a rebrand or a market entry<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Embedded Brand Team<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Senior brand and marketing leadership working inside your business, part-time, as your brand function.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Best for growing companies without a senior marketing team<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Leadership Workshop<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">One or two days with your leadership team, then the Brand House in about a week.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Best for getting leaders aligned, fast<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\" id=\"work\" style=\"background: #0B0F13; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">From the Studio<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Four Brands, Four Journeys.<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">Self-initiated concepts for four fictional companies, each making a move our clients make: into Europe, into the US, into Southeast Asia, and onto the stock exchange. They show how we think and how we craft.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p style=\"margin: 8px 0; font-family: 'Space Grotesk',sans-serif; font-size: 30px; letter-spacing: 0.42em; color: #F4F3EE\">NUVOA<\/p><p class=\"t-b\" style=\"margin: 0; color: #F4F3EE\">A Chinese home-battery maker entering Europe.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The challenge<\/span> World-class engineering and an unknown name, in a market cautious about Chinese technology in the home.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The idea<\/span> Energy you never have to think about.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Positioning \u00b7 Name \u00b7 Identity \u00b7 Product interface \u00b7 Launch film<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p style=\"margin: 8px 0; font-family: 'Playfair Display',Georgia,serif; font-size: 30px; letter-spacing: 0.32em; color: #F4F3EE\">KUMO<\/p><p class=\"t-b\" style=\"margin: 0; color: #F4F3EE\">An Asian tea house brand opening in the United States.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The challenge<\/span> In America, tea means bags and sweet lattes. The brand had to teach a ritual without lecturing anyone.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The idea<\/span> Ten quiet minutes, sold by the cup and the tin.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Brand story \u00b7 Packaging system \u00b7 Caf\u00e9 identity \u00b7 Social Media launch<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p style=\"margin: 8px 0; font-family: 'Archivo',sans-serif; font-size: 30px; letter-spacing: 0.18em; color: #F4F3EE\">TRIVANE<\/p><p class=\"t-b\" style=\"margin: 0; color: #F4F3EE\">An industrial components maker expanding into Southeast Asia.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The challenge<\/span> Buyers choose on reliability and local support, and the brand looked like every other catalogue in the hall.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The idea<\/span> Engineered to the micron. Supported in your time zone.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Brand architecture \u00b7 Sales materials \u00b7 Trade show stand \u00b7 Distributor kit<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p style=\"margin: 8px 0; font-family: 'Playfair Display',Georgia,serif; font-size: 30px; letter-spacing: 0.36em; color: #F4F3EE\">TIDEWELL<\/p><p class=\"t-b\" style=\"margin: 0; color: #F4F3EE\">A family-founded group preparing for a Hong Kong listing.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The challenge<\/span> Three generations of trust with customers and partners, and very little of it visible to investors.<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\"><span style=\"color: #F0C966\">The idea<\/span> Steady for sixty years. Ready for the next sixty.<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">Corporate story \u00b7 Equity narrative \u00b7 Identity refresh \u00b7 Annual report system<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Our Method<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Find. Define. Grow.<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">Every brand is a journey from where you are to where you want to be. We start at the phase you need. Choose one to see what happens in it.<\/p><div class=\"v3-3col\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\"><button type=\"button\" onClick=\"{{g0}}\" aria-pressed=\"{{f0}}\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid {{q0}}; padding: 20px; cursor: pointer; color: {{k0}}\"><span style=\"font: 500 26px/1 'Inter Tight',sans-serif\">Find<\/span><span style=\"font: 400 14px/1.4 Inter,sans-serif\">Why you exist, your route abroad, how premium to be<\/span><\/button><button type=\"button\" onClick=\"{{g1}}\" aria-pressed=\"{{f1}}\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid {{q1}}; padding: 20px; cursor: pointer; color: {{k1}}\"><span style=\"font: 500 26px/1 'Inter Tight',sans-serif\">Define<\/span><span style=\"font: 400 14px/1.4 Inter,sans-serif\">Brand House, Personality, architecture, direction<\/span><\/button><button type=\"button\" onClick=\"{{g2}}\" aria-pressed=\"{{f2}}\" style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid {{q2}}; padding: 20px; cursor: pointer; color: {{k2}}\"><span style=\"font: 500 26px/1 'Inter Tight',sans-serif\">Grow<\/span><span style=\"font: 400 14px/1.4 Inter,sans-serif\">Growth loop, rollout, and handing it over<\/span><\/button><\/div><sc-if value=\"{{f0}}\"><div style=\"display: flex; flex-direction: column; gap: 24px; padding: 28px; background: #0E141A; border: 1px solid #1F2A33\"><p class=\"t-lead\" style=\"margin: 0; color: #F4F3EE\">Find why you matter, where you are going and how premium to be when you get there. A leadership workshop, research in your target markets, and a route everyone signs off.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\"><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Golden Circle<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Why you exist, what you create, then how, plus who it's for, where and when. We start with why, because it is the part of your story that travels to every market.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Growth Journey Map<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Your route from home market to first market, region and global, with a KPI gate at every step and the IPO as one of them.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Brand Level Board<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Your brand placed among brands your customers in the new market already know and love, chosen at the right tier.<\/p><\/div><\/div><\/div><\/sc-if><sc-if value=\"{{f1}}\"><div style=\"display: flex; flex-direction: column; gap: 24px; padding: 28px; background: #0E141A; border: 1px solid #1F2A33\"><p class=\"t-lead\" style=\"margin: 0; color: #F4F3EE\">Define what the brand stands for, how it speaks and how it looks. First the Brand House. Then the Brand Personality that every writer, designer and social post follows, and which name leads in each market.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\"><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Brand House<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Purpose on top, vision and mission beneath, positioning, personality and proof as the pillars, values as the ground.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Brand Personality<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">One guide for copywriting, art direction and tone of voice, so the brand reads as one person on every channel.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Brand Architecture<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Which name leads abroad, and what the group's name does.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Creative Direction<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Three to five directions, each worked through on your real applications.<\/p><\/div><\/div><\/div><\/sc-if><sc-if value=\"{{f2}}\"><div style=\"display: flex; flex-direction: column; gap: 24px; padding: 28px; background: #0E141A; border: 1px solid #1F2A33\"><p class=\"t-lead\" style=\"margin: 0; color: #F4F3EE\">Grow what works, market by market. We run growth as a system around one metric, then hand the brand, the tools and the know-how to your team.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\"><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">The Growth Loop<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Pick the one metric that matters. Map the journey, fix the biggest leak first, test in short cycles, and scale what works.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Embed<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Senior brand and marketing people work inside your business, part-time, as your brand function.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Co-Create<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Your team works alongside ours on every launch, so the skills stay when the project ends.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E3B23C\"><h4 class=\"t-h4\" style=\"margin: 0\">Hand over<\/h4><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">A Brand Book, templates and tools, plus the people and processes to run them in house.<\/p><\/div><\/div><\/div><\/sc-if><p class=\"t-h4\" style=\"margin: 0; color: #F0C966\">Built with you. Owned by you. Whatever we create together stays with your business.<\/p><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #0B0F13; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Before We Meet<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Three Questions to Start with.<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">A few of the exercises we use in our first session. Try them with your team before we meet.<\/p><div style=\"display: flex; flex-direction: column; gap: 16px\"><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><div style=\"aspect-ratio: 16 / 9; overflow: hidden; border-right: 1px solid #1F2A33\"><svg viewBox=\"0 0 800 450\" role=\"img\" aria-label=\"Golden Circle in our order: Why at the centre, then What, then How, with Who, Where and When around the outside\" style=\"display: block; width: 100%; height: 100%\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"450\" fill=\"#0E141A\"><\/rect><text x=\"40\" y=\"40\" text-anchor=\"start\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"15\" fill=\"#AEB6BC\" >Golden Circle, in our order<\/text><circle cx=\"300\" cy=\"240\" r=\"170\" fill=\"none\" stroke=\"#2B3740\" stroke-width=\"2\"><\/circle><circle cx=\"300\" cy=\"240\" r=\"122\" fill=\"none\" stroke=\"#F4F3EE\" stroke-width=\"2\"><\/circle><circle cx=\"300\" cy=\"240\" r=\"78\" fill=\"none\" stroke=\"#F4F3EE\" stroke-width=\"2\"><\/circle><circle cx=\"300\" cy=\"240\" r=\"36\" fill=\"none\" stroke=\"#E3B23C\" stroke-width=\"3\"><\/circle><text x=\"300\" y=\"246\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"17\" fill=\"#F0C966\" >Why<\/text><text x=\"300\" y=\"188\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"16\" fill=\"#F4F3EE\" >What<\/text><text x=\"300\" y=\"144\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"16\" fill=\"#F4F3EE\" >How<\/text><circle cx=\"170\" cy=\"131\" r=\"22\" fill=\"#0E141A\" stroke=\"#AEB6BC\" stroke-width=\"1.5\"><\/circle><text x=\"169.77244466977376\" y=\"135.7261063532883\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"13\" fill=\"#AEB6BC\" >Who<\/text><circle cx=\"430\" cy=\"131\" r=\"22\" fill=\"#0E141A\" stroke=\"#AEB6BC\" stroke-width=\"1.5\"><\/circle><text x=\"430.22755533022627\" y=\"135.72610635328834\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"13\" fill=\"#AEB6BC\" >Where<\/text><circle cx=\"300\" cy=\"410\" r=\"22\" fill=\"#0E141A\" stroke=\"#AEB6BC\" stroke-width=\"1.5\"><\/circle><text x=\"300.0\" y=\"415.0\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"13\" fill=\"#AEB6BC\" >When<\/text><path d=\"M336 240 H 540\" stroke=\"#E3B23C\" stroke-width=\"1.5\"><\/path><text x=\"552\" y=\"224\" text-anchor=\"start\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#F4F3EE\" >Start here.<\/text><text x=\"552\" y=\"248\" text-anchor=\"start\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#F4F3EE\" >Why you exist,<\/text><text x=\"552\" y=\"272\" text-anchor=\"start\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#F4F3EE\" >in one sentence.<\/text><text x=\"552\" y=\"306\" text-anchor=\"start\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >Never \"to make money\".<\/text><\/svg><\/div><div style=\"display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 28px\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Why Do You Exist?<\/h3><p class=\"t-b\" style=\"margin: 0; color: #AEB6BC\">Write why your company exists in one sentence. It can&#39;t be about making money.<\/p><\/div><\/div><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><div style=\"aspect-ratio: 16 / 9; overflow: hidden; border-right: 1px solid #1F2A33\"><svg viewBox=\"0 0 800 450\" role=\"img\" aria-label=\"Growth Journey Map: a road from the home market through three gates, foundation, first market and region, to a global destination flag\" style=\"display: block; width: 100%; height: 100%\"><rect x=\"0\" y=\"0\" width=\"800\" height=\"450\" fill=\"#0E141A\"><\/rect><g transform=\"translate(0 40)\"><path d=\"M60 300 C 150 300, 170 255, 245 248 S 360 200, 420 190 S 540 120, 610 112 S 700 80, 735 70\" fill=\"none\" stroke=\"#1C232A\" stroke-width=\"30\" stroke-linecap=\"round\"><\/path><path d=\"M60 300 C 150 300, 170 255, 245 248 S 360 200, 420 190 S 540 120, 610 112 S 700 80, 735 70\" fill=\"none\" stroke=\"#F4F3EE\" stroke-width=\"2\" stroke-dasharray=\"9 9\" opacity=\".85\"><\/path><circle cx=\"60\" cy=\"300\" r=\"9\" fill=\"#F4F3EE\"><\/circle><path d=\"M232 264 V232 H258 V264\" fill=\"none\" stroke=\"#F4F3EE\" stroke-width=\"3\"><\/path><path d=\"M407 206 V174 H433 V206\" fill=\"none\" stroke=\"#F4F3EE\" stroke-width=\"3\"><\/path><path d=\"M597 128 V96 H623 V128\" fill=\"none\" stroke=\"#F4F3EE\" stroke-width=\"3\"><\/path><path d=\"M735 70 V30\" stroke=\"#E3B23C\" stroke-width=\"3\"><\/path><path d=\"M736 30 L770 41 L736 52 Z\" fill=\"#E3B23C\"><\/path><circle cx=\"735\" cy=\"70\" r=\"8\" fill=\"#E3B23C\"><\/circle><text x=\"92\" y=\"338\" text-anchor=\"middle\" font-family=\"'Inter Tight', Inter, sans-serif\" font-weight=\"500\" font-size=\"22\" fill=\"#F4F3EE\" >Home market<\/text><text x=\"245\" y=\"292\" text-anchor=\"middle\" font-family=\"'Inter Tight', Inter, sans-serif\" font-weight=\"500\" font-size=\"22\" fill=\"#F4F3EE\" >Foundation<\/text><text x=\"245\" y=\"316\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#AEB6BC\" >Gate 1<\/text><text x=\"420\" y=\"234\" text-anchor=\"middle\" font-family=\"'Inter Tight', Inter, sans-serif\" font-weight=\"500\" font-size=\"22\" fill=\"#F4F3EE\" >First market<\/text><text x=\"420\" y=\"258\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#AEB6BC\" >Gate 2<\/text><text x=\"610\" y=\"156\" text-anchor=\"middle\" font-family=\"'Inter Tight', Inter, sans-serif\" font-weight=\"500\" font-size=\"22\" fill=\"#F4F3EE\" >Region<\/text><text x=\"610\" y=\"180\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#AEB6BC\" >Gate 3<\/text><text x=\"722\" y=\"44\" text-anchor=\"end\" font-family=\"'Inter Tight', Inter, sans-serif\" font-weight=\"500\" font-size=\"26\" fill=\"#F0C966\" >Global<\/text><\/g><text x=\"40\" y=\"40\" text-anchor=\"start\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"18\" fill=\"#AEB6BC\" >Growth Journey Map<\/text><\/svg><\/div><div style=\"display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 28px\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Where Are You on the Map?<\/h3><p class=\"t-b\" style=\"margin: 0; color: #AEB6BC\">Mark where you are today: home market, first market, region or global. What number would open the next gate?<\/p><\/div><\/div><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><div style=\"aspect-ratio: 16 / 9; overflow: hidden; border-right: 1px solid #1F2A33\"><svg viewBox=\"0 0 800 450\" ro "580\" cy=\"200\" r=\"8\" fill=\"#0E141A\" stroke=\"#AEB6BC\" stroke-width=\"1.5\"><\/circle><text x=\"580\" y=\"176\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >Too premium<\/text><path d=\"M290 270 H570\" stroke=\"#E3B23C\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"><\/path><text x=\"430\" y=\"296\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"15\" fill=\"#F4F3EE\" >Your brand belongs in this range<\/text><text x=\"400\" y=\"360\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >Do this for three brands your customers in the new market love.<\/text><text x=\"400\" y=\"382\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >Everyone agrees how premium to be, before anyone designs.<\/text><\/svg><\/div><div style=\"display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 28px\"><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">How Premium Should You Be?<\/h3><p class=\"t-b\" style=\"margin: 0; color: #AEB6BC\">Name three brands your customers in the new market already love. For each, name one that&#39;s too premium and one that&#39;s too mass.<\/p><\/div><\/div><\/div><p class=\"t-h4\" style=\"margin: 0; color: #F0C966\">Bring your answers. We will start from there.<\/p><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Experience<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Real Brands Our Partners Have Built.<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">Selected work by our partners, including work done in previous roles. Client names are withheld.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p class=\"t-cap\" style=\"margin: 0; color: #F0C966\">Health and Wellness \u00b7 Hong Kong<\/p><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">A Wellness Centre, Built from the Inside<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Over a year as its marketing function: brand strategy, identity and a three-floor headquarters in Central. The marketing lead we recruited is now a co-founder.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p class=\"t-cap\" style=\"margin: 0; color: #F0C966\">Insurtech \u00b7 Singapore<\/p><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">One Brand for Four Audiences<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">An employee-benefits start-up speaking to employers, employees, insurers and distributors. A two-day workshop, then the Brand House and identity in a week. It went on to serve 500 corporate clients.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p class=\"t-cap\" style=\"margin: 0; color: #F0C966\">Food \u00b7 Hong Kong<\/p><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">Healthy Fast Food with a Superhero Story<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">A sustainable fast-food brand, taken from story to execution: loud, bold and fun, with a back story that explains why organic food is good for you.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p class=\"t-cap\" style=\"margin: 0; color: #F0C966\">Integrative Health<\/p><h3 class=\"t-h3\" style=\"margin: 0; color: #F4F3EE\">A Periodic Table for Nutrition<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">A holistic wellness pharmacy with one icon for every nutrition category, a Brand Book, and packaging printed in ink that changes when you touch it.<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">People<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">The Right People for Every Brand.<\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">The best creative people rarely sit on one payroll, and no single team is right for every brand. For each engagement we bring together the senior specialists the work needs, from a network we have built across Asia Pacific. One partner leads, and the team works as part of yours.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #E3B23C\"><p class=\"t-cap\" style=\"margin: 0; color: #F0C966\">Leads Every Engagement<\/p><h3 class=\"t-h3\" style=\"margin: 0\">Larry Tang<\/h3><p class=\"t-s\" style=\"margin: 0; color: #E3B23C\">Senior Partner, Executive Creative Director<\/p><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Former Managing Director of Digitas and Razorfish, and Deputy General Manager of McCann&#39;s MRM, leading work for Intel and Dell. Founder of a group of award-winning sustainable food brands, built from zero.<\/p><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 4px\"><h3 class=\"t-h4\" style=\"margin: 0\">The Specialists We Bring in<\/h3><p class=\"t-b\" style=\"margin: 0; padding: 10px 0; border-top: 1px solid #1F2A33; color: #F4F3EE\">Creative Director<\/p><p class=\"t-b\" style=\"margin: 0; padding: 10px 0; border-top: 1px solid #1F2A33; color: #F4F3EE\">Art Director<\/p><p class=\"t-b\" style=\"margin: 0; padding: 10px 0; border-top: 1px solid #1F2A33; color: #F4F3EE\">Writer and Content Strategist<\/p><p class=\"t-b\" style=\"margin: 0; padding: 10px 0; border-top: 1px solid #1F2A33; color: #F4F3EE\">Growth and Technology Lead<\/p><p class=\"t-b\" style=\"margin: 0; padding: 10px 0; border-top: 1px solid #1F2A33; color: #F4F3EE\">Photographer<\/p><p class=\"t-s\" style=\"margin: 0; color: #8A949C\">+ Film, digital, social and experience design, as needed<\/p><div style=\"padding-top: 8px\"><a class=\"v3-btn\" href=\"team.html\" style=\"background: transparent; border-color: rgba(255,255,255,.5); color: #F4F3EE\">Meet the Team<\/a><\/div><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #0B0F13; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 48px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">XInsight<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 40px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">One Brand Partner.<br><span style=\"color: #AEB6BC\">The Whole of XInsight Behind
