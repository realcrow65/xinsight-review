.5\" opacity=\"0.32\"><\/rect><rect x=\"588\" y=\"308\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#AEB6BC\" stroke-width=\"1.5\" opacity=\"0.32\"><\/rect><rect x=\"636\" y=\"319\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#AEB6BC\" stroke-width=\"1.5\" opacity=\"0.32\"><\/rect><rect x=\"684\" y=\"312\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#AEB6BC\" stroke-width=\"1.5\" opacity=\"0.32\"><\/rect><text x=\"310\" y=\"412\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >Different local<\/text><text x=\"310\" y=\"430\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >interpretations<\/text><text x=\"626\" y=\"412\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >Separate providers,<\/text><text x=\"626\" y=\"430\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >fragmented decisions<\/text><text x=\"470\" y=\"412\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >More markets,<\/text><text x=\"470\" y=\"430\" text-anchor=\"middle\" font-family=\"Inter, 'Noto Sans SC', sans-serif\" font-size=\"14\" fill=\"#AEB6BC\" >less visibility<\/text><\/svg><\/div><div class=\"v3-3col\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #2FB28A\"><h3 class=\"t-h4\" style=\"margin: 0\">Global Ambition. Different Local Interpretations.<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Headquarters sets the direction, but differences in culture, communication, and management practices can lead overseas teams towards different priorities.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Local Specialists. Fragmented Decisions.<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Employment, corporate, accounting, and tax advice often comes from separate providers. Individually sound decisions can create gaps when their wider business implications are overlooked.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">More Markets. Less Visibility.<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">As your footprint grows, it becomes harder to see the full picture of costs, obligations, and performance, and to respond before emerging issues affect the business.<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\" id=\"expertise\" style=\"background: #030507; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 62px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">Our Expertise<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 52px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Build the Foundations.<br><span style=\"color: #AEB6BC\">Strengthen Your Ability to Grow.<\/span><\/h2><p class=\"t-lead\" style=\"margin: 0; color: #AEB6BC; max-width: 760px\">Whether you are entering your first overseas market or improving an established international business, we help you connect four areas that shape your success.<\/p><div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 24px\"><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #2FB28A\"><h3 class=\"t-h4\" style=\"margin: 0\">Business Establishment<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Shape the corporate structures and market-entry foundations that support your international ambitions.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">People &amp; Culture<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Align your people, organisational culture, and local employment practices to build cohesive teams across markets.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Operations &amp; Compliance<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Anticipate regulatory and market shifts, and build agile operating and governance frameworks to respond quickly while balancing global direction with local requirements.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid #F4F3EE\"><h3 class=\"t-h4\" style=\"margin: 0\">Finance &amp; Tax<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">Strengthen financial visibility, tax planning, and control to inform confident decisions across markets.<\/p><\/div><\/div><\/div>\n<\/div><\/div><\/section><section class=\"v3-sec\"  style=\"background: #0B0F13; border-top: 1px solid #1F2A33\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 62px\">\n<p class=\"t-cap\" style=\"grid-column: 1 / span 3; margin: 0; padding-top: 14px; border-top: 1px solid #F4F3EE; color: #F4F3EE\">How We Work with You<\/p>\n<div style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 52px; padding-top: 14px; border-top: 1px solid #1F2A33\"><h2 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE\">Your Ambition Understood.<br><span style=\"color: #AEB6BC\">Your Local Decisions Connected.<\/span><\/h2><div style=\"border: 1px solid #1F2A33; aspect-ratio: 16
