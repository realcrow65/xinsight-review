m: 1.5px solid #C8321E\">XConsulting<\/a>\n<a href=\"team.html\" style=\"color: {{hdrInk}}\">Team<\/a>\n<a class=\"v3-navcta\" href=\"#contact\">Start a conversation<\/a><a class=\"v3-sq\" href=\"mailto:hello@xinsight.ai\" aria-label=\"Email XInsight\">&#8599;<\/a>\n<\/nav>\n<button type=\"button\" class=\"v3-show-sm\" onClick=\"{{toggleMenu}}\" aria-expanded=\"{{menuOpen}}\" style=\"align-items: center; justify-content: center; height: 40px; min-width: 40px; padding: 0 14px; background: #F4F3EE; border: 1px solid #F4F3EE; color: #0B0F13; font: 400 14px/1 Inter,sans-serif; cursor: pointer\">{{menuLabel}}<\/button>\n<sc-if value=\"{{menuOpen}}\"><nav aria-label=\"Menu\" class=\"v3-show-sm\" style=\"position: fixed; top: 80px; left: 10px; right: 10px; border-radius: 10px; flex-direction: column; gap: 0; padding: 8px 24px 20px; background: #030507; border-bottom: 1px solid #1F2A33; z-index: 60\">\n<a href=\"x-brand.html\" style=\"padding: 14px 0; border-bottom: 1px solid #1F2A33; color: #F4F3EE; text-decoration: none; font: 500 18px/1.2 Inter,sans-serif\">XBrand<\/a>\n<a href=\"x-global.html\" style=\"padding: 14px 0; border-bottom: 1px solid #1F2A33; color: #F4F3EE; text-decoration: none; font: 500 18px/1.2 Inter,sans-serif\">XGlobal<\/a>\n<a href=\"x-consulting.html\" style=\"padding: 14px 0; border-bottom: 1px solid #1F2A33; color: #F4F3EE; text-decoration: none; font: 500 18px/1.2 Inter,sans-serif\">XConsulting<\/a>\n<a href=\"team.html\" style=\"padding: 14px 0; border-bottom: 1px solid #1F2A33; color: #F4F3EE; text-decoration: none; font: 500 18px/1.2 Inter,sans-serif\">Team<\/a>\n<a href=\"mailto:hello@xinsight.ai\" style=\"padding: 14px 0; color: #F15025; text-decoration: none; font: 500 18px/1.2 Inter,sans-serif\">Start a Conversation<\/a>\n<\/nav><\/sc-if>\n\n<\/div>\n<\/div>\n<\/header>\n<section id=\"top\" style=\"background: #030507; padding: 152px 0 120px\">\n<div class=\"v3-wrap\"><div class=\"v3-grid\" style=\"row-gap: 40px\">\n<div style=\"grid-column: 1 / span 3; padding-top: 14px; border-top: 1px solid #F4F3EE; display: flex; flex-direction: column; gap: 14px\">\n<a href=\"x-consulting.html#cases\" class=\"t-s\" style=\"color: #F4F3EE; text-decoration: none\"><span aria-hidden=\"true\">\u2190<\/span> Back to Case Studies<\/a>\n<a href=\"x-consulting.html\" class=\"t-s\" style=\"color: #8A949C; text-decoration: none\">XConsulting<\/a>\n<nav aria-label=\"On this page\" style=\"position: sticky; top: 110px; display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 18px; border-top: 1px solid #1F2A33\"><span class=\"t-cap\" style=\"color: #8A949C\">On This Page<\/span><a href=\"#s1\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">Business Challenge<\/a><a href=\"#s2\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">Strategic Orientation<\/a><a href=\"#s3\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">Transforming Voice into Digital Content<\/a><a href=\"#s4\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">Building Audience Intelligence<\/a><a href=\"#s5\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">The Transformation<\/a><a href=\"#s6\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">Stronger Advertising Value for Brand Owners<\/a><a href=\"#s7\" class=\"t-s\" style=\"color: #AEB6BC; text-decoration: none\">The Next Step<\/a><\/nav><\/div>\n<article style=\"grid-column: 4 / span 9; display: flex; flex-direction: column; gap: 22px; padding-top: 14px; border-top: 1px solid #1F2A33\">\n<p class=\"t-cap\" style=\"margin: 0; color: #FF8577\">AI Transformation Case Study<\/p>\n<h1 class=\"t-h2\" style=\"margin: 0; color: #F4F3EE; max-width: 900px\">From Radio Broadcaster to AI-Powered Digital Media Platform<\/h1>\n<p class=\"t-lead\" style=\"margin: 0 0 8px; color: #F4F3EE; max-width: 820px\">How a radio broadcaster built an AI-powered digital media platform, transforming voice content into reusable digital assets and creating new advertising revenue opportunities.<\/p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch\"><div style=\"flex: 1 1 0; min-width: 220px; display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #1F2A33\"><span class=\"t-cap\" style=\"color: #8A949C\">From<\/span><span class=\"t-h4\" style=\"color: #F4F3EE\">Radio Broadcaster<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #C8321E; font: 400 32px/1 Inter,sans-serif\">\u2192<\/span><div style=\"flex: 1 1 0; min-width: 220px; display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #C8321E\"><span class=\"t-cap\" style=\"color: #8A949C\">To<\/span><span class=\"t-h4\" style=\"color: #F4F3EE\">AI-Powered Digital Media Platform<\/span><\/div><\/div>\n<figure class=\"v3-blurwrap\" style=\"margin: 8px 0 0; --bimg: url(img/b0fe131a1a61df1c2babf68ce2d3fec7.jpeg)\"><img src=\"img/b0fe131a1a61df1c2babf68ce2d3fec7.jpeg\" alt=\"Radio content transformed into multi-channel digital distribution: Facebook, articles, Instagram, Xiaohongshu, and web\" style=\"display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; box-shadow: 0 20px 60px rgba(0,0,0,.45)\"><\/figure>\n<h2 id=\"s1\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">Business Challenge<\/h2>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The radio broadcaster had built a strong audience through traditional broadcasting. However, much of its content still existed only as voice, making it difficult to preserve, organise, and develop into reusable digital assets.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">Without a stronger digital foundation, the organisation had limited ability to apply AI, extend the value of its programmes, or build a clearer understanding of its audience.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The same limitation affected its advertising business. Campaigns remained centred on traditional radio, sponsorships, promotional activities, and offline events, with limited real-time measurement, audience analysis, and post-campaign reporting.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">For brand owners, radio remained valuable for reach and credibility, but increasingly difficult to compare with digital media. Campaign performance was less visible, audience profiles were limited, and advertising products were often built around one-off exposure rather than ongoing engagement.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The organisation wanted to answer three key questions:<\/p>\n<div class=\"v3-3col\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 10px; padding: 22px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><h3 class=\"t-h4\" style=\"margin: 0; color: #F4F3EE\">Voice to Digital Assets<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">How can we turn voice-based content into reusable digital assets?<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 10px; padding: 22px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><h3 class=\"t-h4\" style=\"margin: 0; color: #F4F3EE\">Understand &amp; Retain Audience<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">How can we better understand, retain, and re-engage our audience?<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 10px; padding: 22px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><h3 class=\"t-h4\" style=\"margin: 0; color: #F4F3EE\">Better Advertising Solutions<\/h3><p class=\"t-s\" style=\"margin: 0; color: #AEB6BC\">How can we offer brand owners more measurable, integrated, and commercially valuable advertising solutions?<\/p><\/div><\/div>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The challenge was not simply moving radio content online. It was building the digital foundation needed to strengthen audience relationships, create better advertising products, and unlock new revenue opportunities.<\/p>\n<h2 id=\"s2\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">Strategic Orientation<\/h2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch\"><div style=\"flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><span lang=\"zh-Hant\" style=\"font: 500 40px/1 'Noto Serif TC','Noto Sans SC',serif; color: #FF8577\">\u77e5<\/span><span class=\"t-s\" style=\"color: #F4F3EE; font-weight: 500\">Awareness<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #C8321E; font: 400 28px/1 Inter,sans-serif\">\u2192<\/span><div style=\"flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><span lang=\"zh-Hant\" style=\"font: 500 40px/1 'Noto Serif TC','Noto Sans SC',serif; color: #FF8577\">\u52e2<\/span><span class=\"t-s\" style=\"color: #F4F3EE; font-weight: 500\">Workforce, Workflow &amp; Automation<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #C8321E; font: 400 28px/1 Inter,sans-serif\">\u2192<\/span><div style=\"flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><span lang=\"zh-Hant\" style=\"font: 500 40px/1 'Noto Serif TC','Noto Sans SC',serif; color: #FF8577\">\u8b00<\/span><span class=\"t-s\" style=\"color: #F4F3EE; font-weight: 500\">Intelligence &amp; Decision Systems<\/span><\/div><\/div>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">We began by helping the organisation understand that its challenge was not simply a lack of digital channels. The deeper issue was that much of its programme content, audience activity, and campaign experience had never been captured as reusable digital assets.<\/p>\n<h2 id=\"s3\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">Transforming Voice into Digital Content<\/h2>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">Moving into Workforce, Workflow &amp; Automation (\u52e2), we redesigned the workflow around two connected flows.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The first transformed voice-based radio programmes into structured digital content. After each broadcast, the AI application converted the spoken content into text and generated articles, website content, mobile app content, and social media posts.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">This allowed each programme to remain searchable, discoverable, and valuable long after the original broadcast had ended. Instead of reaching audiences only during a live programme or through an audio recording, the same content could continue to attract readers and listeners through websites, mobile apps, search engines, social media, and offline events.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">This created a longer digital life for every programme and turned one-time broadcasts into reusable digital assets.<\/p>\n<h2 id=\"s4\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">Building Audience Intelligence<\/h2>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The second flow brought together website activity, mobile app activity, audience behaviour, and existing customer information. Automated analysis helped the organisation build a clearer understanding of who its audiences were, what content interested them, and how they responded to different campaigns across different channels.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">These two flows created a continuous cycle. Content attracted and engaged audiences, audience activity strengthened the organisation\u2019s digital assets, and those insights helped the broadcaster improve its content, customer relationships, and future campaigns.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">Over time, these capabilities began to support Intelligence &amp; Decision Systems (\u8b00), helping the broadcaster better understand its audience, improve campaign performance, and make more informed advertising decisions.<\/p>\n<h2 id=\"s5\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">The Transformation<\/h2>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The organisation evolved from a traditional broadcasting model into an AI-powered digital media platform.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">Today, every programme creates value beyond the original broadcast. The broadcaster can now:<\/p>\n<div class=\"v3-2col\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\"><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Transform voice-based programmes into reusable digital assets automatically<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Extend the life and reach of every programme beyond the original broadcast<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Distribute content across radio, websites, mobile apps, social media, and offline events<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Build a growing and searchable content library<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Develop a clearer and more valuable audience portfolio<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Analyse audience interests and behaviour across multiple channels<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Extend campaigns across broadcast, digital, mobile, social, and offline touchpoints<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Monitor campaign performance more effectively<\/span><\/div><div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #0E141A; border: 1px solid #1F2A33\"><span aria-hidden=\"true\" style=\"flex: none; width: 10px; height: 10px; margin-top: 7px; background: #C8321E\"><\/span><span class=\"t-s\" style=\"color: #F4F3EE\">Provide brand owners with stronger audience insights and reporting<\/span><\/div><\/div>\n<h2 id=\"s6\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">Stronger Advertising Value for Brand Owners<\/h2>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">This transformation changed how advertisers could view the broadcaster. Instead of offering only airtime, sponsorships, and offline events, the organisation could offer integrated campaigns supported by digital content, audience insights, and measurable engagement.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">Brand owners could gain broader and longer-lasting exposure, a clearer understanding of the audiences reached, and more useful information to review campaign performance.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">By offering stronger reach across both online and offline touchpoints, clearer audience value, and more measurable campaign outcomes, the organisation could attract more advertisers, deepen relationships with existing clients, and create new sources of advertising revenue.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">Each campaign also contributed to the next. Audience insights, content performance, and campaign learning could be retained and reused, helping the organisation improve advertising effectiveness, build a more valuable audience portfolio, and grow the business over time.<\/p>\n<h2 id=\"s7\" class=\"t-h3\" style=\"margin: 40px 0 0; padding-top: 24px; border-top: 1px solid #1F2A33; color: #F4F3EE\">The Next Step<\/h2>\n<p class=\"t-cap\" style=\"margin: 0; color: #8A949C\">Next Orientation<\/p><div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch\"><div style=\"flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #0E141A; border: 1px solid #1F2A33; border-top: 3px solid #C8321E\"><span lang=\"zh-Hant\" style=\"font: 500 40px/1 'Noto Serif TC','Noto Sans SC',serif; color: #FF8577\">\u8b8a<\/span><span class=\"t-s\" style=\"color: #F4F3EE; font-weight: 500\">New Business &amp; Value Innovation<\/span><\/div><\/div>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">The next stage is to connect content, audience, and campaign insights more closely across every channel.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">By understanding which topics attract different audience groups, how users move between radio, websites, mobile apps, social platforms, and offline events, and which content leads to stronger engagement, the broadcaster can begin to develop more targeted and measurable advertising solutions.<\/p>\n<p class=\"t-b\" style=\"margin: 0; color: #AEB6BC; max-width: 720px\">This creates opportunities to offer brand owners richer audience profiles, more relevant campaign planning, and clearer performance reporting. It also provides the foundation for more personalised content, stronger customer relationship management, and new digital advertising products.<\/p>\n<p class=\"t-h3\" style=\"margin: 24px 0 0; padding: 28px 0 0; border-top: 3px solid #C8321E; color: #F4F3EE; max-width: 820px\">Over time, the broadcaster can move from selling individual advertising placements to offering integrated media solutions across radio, websites, mobile apps, social platforms, digital content, and offline audience engagement.<\/p>\n<div style=\"margin-top: 40px; padding-top: 24px; border-top: 1px solid #1F2A33\"><a class=\"v3-btn\" href=\"x-consulting.html#cases\" style=\"background: transparent; border-color: rgba(255,255,255,.5); color: #F4F3EE\"><span aria-hidden=\"true\">\u2190<\/span> Back to Case Studies<\/a><\/div>\n<\/article><\/div><\/div><\/section><footer class=\"v3-foot\" style=\"background: #0B0F13; border-top: 1px solid #1F2A33; padding: 72px 0 40px\">\n<div class=\"v3-wrap\">\n<div class=\"v3-grid\" style=\"row-gap: 40px\">\n<div style=\"grid-column: 1 / span 5; display: flex; flex-direction: column; gap: 20px\"><span style=\"display:inline-block;transform:scaleY(1.3);transform-origin:left bottom;font-family:'Archivo',sans-serif;font-stretch:75%;font-weight:700;font-size:24px;letter-spacing:0.22em;margin-right:-0.22em;line-height:1;color:#F4F3EE;white-space:nowrap\"><svg viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\" style=\"color:#F15025;display:inline-block;width:0.894em;height:0.6875em;margin:0 0.25em 0 0.02em;vertical-align:baseline;overflow:visible\"><defs><clipPath id=\"h4fc\"><rect x=\"0\" y=\"0\" width=\"100\" height=\"100\"><\/rect><\/clipPath><mask id=\"h4fm\" maskUnits=\"userSpaceOnUse\" x=\"-50\" y=\"-50\" width=\"200\" height=\"200\"><rect x=\"-50\" y=\"-50\" width=\"200\" height=\"200\" fill=\"#fff\"><\/rect><path d=\"M 1.0 112 L 99.0 -12\" stroke=\"#000\" stroke-width=\"38\" fill=\"none\"><\/path><\/mask><\/defs><g clip-path=\"url(#h4fc)\" fill=\"none\" stroke=\"currentColor\" stroke-w
